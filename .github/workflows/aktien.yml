name: Aktiendaten aktualisieren

on:
  schedule:
    - cron: "23 5 * * 0"     # jeden Sonntag 05:23 UTC (nach dem Marktdaten-Lauf vom Samstag)
  workflow_dispatch:          # manueller Start über «Run workflow»

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install --quiet yfinance pandas lxml requests

      - name: Aktien abrufen (dauert 20–60 Minuten)
        env:
          SEC_UA: ${{ vars.SEC_UA }}   # optional: Kontaktangabe für die SEC (Settings → Variables)
        run: python scripts/fetch_aktien.py

      - name: Ergebnis speichern
        run: |
          git config user.name  "marktdaten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aktien.json data/universum.json
          git diff --cached --quiet || git commit -m "Aktiendaten $(date -u +%F)"
          git pull --rebase --quiet
          git push
