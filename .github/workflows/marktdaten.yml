name: Marktdaten aktualisieren

on:
  schedule:
    - cron: "17 6 * * 6"     # jeden Samstag 06:17 UTC – alle Börsen der Woche sind geschlossen
  workflow_dispatch:          # manueller Start über den Button «Run workflow»

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install --quiet yfinance pandas

      - name: Kurse abrufen
        run: python scripts/fetch_marktdaten.py

      - name: Ergebnis speichern
        run: |
          git config user.name  "marktdaten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marktdaten.json
          git diff --cached --quiet || git commit -m "Marktdaten $(date -u +%F)"
          git push
